name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Instalar Ngrok
      run: |
        # O Chocolatey instala a versão mais recente e estável automaticamente
        choco install ngrok -y

    - name: Auth Ngrok
      run: |
        # Com o choco, o comando 'ngrok' fica disponível globalmente (sem o ./)
        ngrok config add-authtoken 39GjIAFCVSrHfZte4mYiSsVhCKD_5GTFAWDz8W6WxyiFcgeVE

    - name: Create User
      run: |
        net user pcuser Senha123! /add
        net localgroup administrators pcuser /add

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

    - name: Start Tunnel
      run: |
        # Inicia o túnel em segundo plano
        Start-Process ngrok -ArgumentList "tcp 3389"

    - name: Get IP and Keep Alive
      run: |
        echo "Aguardando o tunnel subir..."
        Start-Sleep 15
        # O comando abaixo tenta mostrar o IP direto no log para facilitar sua vida
        curl http://127.0.0.1:4040/api/tunnels
        echo ""
        echo "PC Virtual pronto! Use o IP acima ou veja no painel do Ngrok."
        while ($true) { Start-Sleep 60 }
