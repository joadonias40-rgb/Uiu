name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Download Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNy7zQgnHm4/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Auth Ngrok
      run: |
        .\ngrok.exe config add-authtoken 39GjIAFCVSrHfZte4mYiSsVhCKD_5GTFAWDz8W6WxyiFcgeVE

    - name: Create User
      run: |
        net user pcuser Senha123! /add
        net localgroup administrators pcuser /add

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

    - name: Start Tunnel
      run: |
        .\ngrok.exe tcp 3389 --log=stdout

    - name: Keep Alive
      run: |
        echo "PC Virtual pronto!"
        while ($true) { Start-Sleep 60 }
