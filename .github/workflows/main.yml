name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download Ngrok
      run: |
        # Baixando a versão 3 estável via link oficial direto para evitar erros de 'Not Found'
        curl.exe -L -o ngrok.zip https://bin.equinox.io/c/bNy7zQgnHm4/ngrok-v3-stable-windows-amd64.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Auth Ngrok
      run: |
        .\ngrok.exe config add-authtoken 39GjIAFCVSrHfZte4mYiSsVhCKD_5GTFAWDz8W6WxyiFcgeVE

    - name: Create User
      run: |
        net user pcuser Senha123! /add
        net localgroup administrators pcuser /add

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

    - name: Start Tunnel
      run: |
        # Usando o comando exatamente como você solicitou
        .\ngrok.exe tcp 3389 --log=stdout --log-level=info --console-ui=false

    - name: Keep Alive
      run: |
        # Este passo só será alcançado se o ngrok for fechado, 
        # mas mantemos por segurança para a máquina não desligar.
        while ($true) { Start-Sleep 60 }
