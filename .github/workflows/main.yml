name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Instalar Ngrok (Garantido)
      run: |
        # Usamos o Chocolatey para evitar erros de link 404/402
        choco install ngrok -y

    - name: Auth Ngrok
      run: |
        # Com choco, o ngrok fica no PATH do sistema, não precisa de .\
        ngrok config add-authtoken 39GjIAFCVSrHfZte4mYiSsVhCKD_5GTFAWDz8W6WxyiFcgeVE

    - name: Create User
      run: |
        net user pcuser Senha123! /add
        net localgroup administrators pcuser /add

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

    - name: Start Tunnel
      run: |
        # O comando que você pediu, rodando de forma estável
        ngrok tcp 3389 --log=stdout --log-level=info --console-ui=false

    - name: Keep Alive
      run: |
        while ($true) { Start-Sleep 60 }
