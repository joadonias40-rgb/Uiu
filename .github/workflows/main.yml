name: Windows RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Instalar Ngrok via Chocolatey
      run: |
        # Instala a versão mais recente estável automaticamente
        choco install ngrok -y

    - name: Auth Ngrok
      run: |
        # O 'ngrok' instalado via choco já fica no PATH, não precisa do .\
        ngrok config add-authtoken 39GjIAFCVSrHfZte4mYiSsVhCKD_5GTFAWDz8W6WxyiFcgeVE

    - name: Create User
      run: |
        net user pcuser Senha123! /add
        net localgroup administrators pcuser /add

    - name: Enable RDP
      run: |
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0

    - name: Start Tunnel
      run: |
        # Inicia o túnel TCP na porta 3389
        Start-Process ngrok -ArgumentList "tcp 3389"

    - name: Keep Alive
      run: |
        echo "PC Virtual pronto!"
        echo "Acesse o painel do Ngrok para pegar o endereço IP."
        while ($true) { Start-Sleep 60 }
